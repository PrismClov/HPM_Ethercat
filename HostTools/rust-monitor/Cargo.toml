[package]
name = "ethercat-monitor"
version = "0.1.0"
edition = "2021"
default-run = "ethercat-monitor"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:serde", "dep:serde_json", "dep:rfd"]

[[bin]]
name = "ethercat-monitor"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "ethercat-service"
path = "src/service/main.rs"

[dependencies]
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
xml-rs = "0.8.29"
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
rfd = { version = "0.15.4", optional = true }
